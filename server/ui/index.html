<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>ابتسامة عمّان · المساعد الصوتي</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
    <script>
      // Apply saved theme/language before first paint (no flash).
      try {
        var t = localStorage.getItem("va-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        var l = localStorage.getItem("va-lang");
        if (l === "en") { document.documentElement.lang = "en"; document.documentElement.dir = "ltr"; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="topbar">
      <a class="brandmark" href="./" aria-label="Home">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.4" />
          <path d="M9.5 17.5c1.8 3.4 4 5 6.5 5s4.7-1.6 6.5-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
          <circle cx="16" cy="10.5" r="2.2" fill="currentColor" />
        </svg>
      </a>
      <div class="topbar-actions">
        <button class="chip" id="langBtn" type="button"></button>
        <button class="icon-btn" id="themeBtn" type="button">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" /><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6" /></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.6A8.4 8.4 0 0 1 9.4 4a8.4 8.4 0 1 0 10.6 10.6Z" /></svg>
        </button>
      </div>
    </header>

    <main class="layout">
      <section class="stage" aria-labelledby="companyName">
        <h1 class="company" id="companyName" data-i18n="company"></h1>
        <p class="product" data-i18n="product"></p>
        <p class="subtitle" data-i18n="subtitle"></p>

        <div class="orb-wrap">
          <canvas id="orb" aria-hidden="true"></canvas>
        </div>
        <p class="status" id="status" aria-live="polite"></p>

        <div class="controls">
          <button class="round-btn" id="muteBtn" type="button" disabled>
            <svg class="i-mic" viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="3" width="7" height="12" rx="3.5" /><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3" /></svg>
            <svg class="i-mic-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 10V6.5a3.5 3.5 0 0 0-6.6-1.6M8.5 9v2.5a3.5 3.5 0 0 0 5.3 3M5.5 11.5a6.5 6.5 0 0 0 10.6 5M18.5 11.5c0 .7-.1 1.4-.3 2M12 18v3M3.5 3.5l17 17" /></svg>
          </button>

          <button class="call-btn" id="callBtn" type="button" data-state="idle">
            <span class="call-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M6.6 3.5h2.6l1.5 4-2 1.4a11 11 0 0 0 6.4 6.4l1.4-2 4 1.5v2.6a2 2 0 0 1-2.1 2A16.6 16.6 0 0 1 4.6 5.6a2 2 0 0 1 2-2.1Z" /></svg>
            </span>
            <span class="call-label" id="callLabel"></span>
          </button>

          <div class="settings">
            <button class="round-btn" id="settingsBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="settingsMenu">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" /><circle cx="16" cy="7" r="2.2" /><circle cx="10" cy="17" r="2.2" /></svg>
            </button>
            <div class="menu" id="settingsMenu" role="dialog" aria-labelledby="settingsTitle" hidden>
              <p class="menu-title" id="settingsTitle" data-i18n="settings"></p>
              <label class="field-label" for="micSelect" data-i18n="microphone"></label>
              <select id="micSelect"></select>
              <p class="menu-hint" id="micHint" data-i18n="micHint"></p>
            </div>
          </div>
        </div>

        <p class="alert" id="alert" role="alert" hidden></p>
      </section>

      <section class="transcript" aria-labelledby="transcriptTitle">
        <h2 class="transcript-title" id="transcriptTitle" data-i18n="transcript"></h2>
        <div class="transcript-body" id="transcript" aria-live="polite">
          <p class="transcript-empty" id="transcriptEmpty" data-i18n="empty"></p>
        </div>
      </section>
    </main>

    <audio id="botAudio" autoplay playsinline></audio>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
